<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NULLPOINT</title>
    <!--
      Inline favicon. Without one the browser requests /favicon.ico and logs a
      404, which is a real console error the Phase 1 exit criteria forbid.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0c0f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234fd1c5' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%234fd1c5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --hud-fg: #d7e2ea;
        --hud-dim: #7c8b98;
        --hud-accent: #4fd1c5;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c0f;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* ---- Development HUD. Temporary: see DebugHud.ts ---- */
      #debug-hud {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        min-width: 210px;
        background: rgba(8, 11, 15, 0.72);
        border: 1px solid rgba(79, 209, 197, 0.25);
        border-radius: 4px;
        color: var(--hud-fg);
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
        user-select: none;
        white-space: pre;
      }

      #debug-hud .title {
        display: block;
        margin-bottom: 6px;
        color: var(--hud-accent);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      #debug-hud .dim {
        color: var(--hud-dim);
      }

      #controls-hint {
        position: absolute;
        bottom: 12px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(8, 11, 15, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        color: var(--hud-dim);
        font-size: 11px;
        line-height: 1.6;
        pointer-events: none;
        user-select: none;
      }

      /* ---- Combat HUD. Player-facing, distinct from the development HUD. ---- */
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        --gap: 7px;
      }

      #crosshair span {
        position: absolute;
        left: 50%;
        top: 50%;
        background: #eaf2f7;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
        transition: background-color 120ms linear;
      }

      /* Four ticks around a centre dot; --gap animates with accuracy. */
      #crosshair .v {
        width: 2px;
        height: 6px;
        margin-left: -1px;
      }
      #crosshair .h {
        width: 6px;
        height: 2px;
        margin-top: -1px;
      }
      #crosshair .up { transform: translate(0, calc(-100% - var(--gap))); }
      #crosshair .down { transform: translate(0, var(--gap)); }
      #crosshair .left { transform: translate(calc(-100% - var(--gap)), 0); }
      #crosshair .right { transform: translate(var(--gap), 0); }
      #crosshair .dot {
        width: 2px;
        height: 2px;
        margin: -1px 0 0 -1px;
        border-radius: 50%;
        opacity: 0.85;
      }

      #crosshair.empty span { background: #e06a6a; }
      #crosshair.reloading span { background: #d8b45c; }

      #hit-marker {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 26px;
        line-height: 1;
        color: #f2f6f9;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.95);
        pointer-events: none;
        user-select: none;
        opacity: 0;
      }

      #ammo {
        position: absolute;
        right: 26px;
        bottom: 22px;
        color: var(--hud-fg);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
        pointer-events: none;
        user-select: none;
      }

      #ammo.empty { color: #e06a6a; }
      #ammo.reloading { color: #d8b45c; font-size: 18px; }

      /* ---- Click-to-play overlay ---- */
      #lock-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        background: rgba(6, 8, 11, 0.78);
        color: var(--hud-fg);
        cursor: pointer;
        user-select: none;
      }

      #lock-overlay[hidden] {
        display: none;
      }

      #lock-overlay h1 {
        font-size: 34px;
        letter-spacing: 0.3em;
        color: var(--hud-accent);
        font-weight: 700;
      }

      #lock-overlay p {
        font-size: 13px;
        color: var(--hud-dim);
      }

      /* ---- Fatal error panel ---- */
      #fatal {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 32px;
        background: #120708;
        color: #ffb4b4;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      #fatal[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="debug-hud" data-testid="debug-hud"></div>
      <div id="controls-hint" data-testid="controls-hint">
        WASD move &nbsp;·&nbsp; Mouse look &nbsp;·&nbsp; LMB fire &nbsp;·&nbsp; RMB aim &nbsp;·&nbsp;
        R reload &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; Alt walk &nbsp;·&nbsp; Space jump &nbsp;·&nbsp;
        Ctrl/C crouch &nbsp;·&nbsp; Esc release cursor
      </div>
      <div id="crosshair" data-testid="crosshair">
        <span class="v up"></span>
        <span class="v down"></span>
        <span class="h left"></span>
        <span class="h right"></span>
        <span class="dot"></span>
      </div>
      <div id="hit-marker" data-testid="hit-marker">&#10005;</div>
      <div id="ammo" data-testid="ammo">30 / 120</div>
      <div id="lock-overlay" data-testid="lock-overlay">
        <h1>NULLPOINT</h1>
        <p>Click to play</p>
        <p class="dim">Press Esc to release the cursor</p>
      </div>
      <div id="fatal" data-testid="fatal" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
